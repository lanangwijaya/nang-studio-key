<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran</title><link rel="stylesheet" href="/style.css"></head><body><main><b class="brand">NANG STUDIO</b><section><h1>Pembayaran</h1><div id="detail">Memuat...</div><img id="qr" class="qr" hidden><div id="status"></div><div id="result"></div></section></main><script>
const oid=new URLSearchParams(location.search).get("order_id");let currentKey="";
async function load(){try{const r=await fetch("/api/status?order_id="+encodeURIComponent(oid)),d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector("#detail").innerHTML=`<b>Order:</b> ${esc(d.order_id)}<br><b>UserId:</b> ${esc(d.user_id)}<br><b>Paket:</b> ${d.days} hari<br><b>Total:</b> Rp${Number(d.amount).toLocaleString("id-ID")}`;if(d.qr_url){const q=document.querySelector("#qr");q.src=d.qr_url;q.hidden=false}document.querySelector("#status").textContent=d.paid?"PEMBAYARAN BERHASIL ✓":(d.status_text||"Menunggu pembayaran...");if(d.paid){currentKey=d.key;document.querySelector("#result").innerHTML=`<div class="success"><div class="key">${esc(d.key)}</div><button onclick="navigator.clipboard.writeText(currentKey)">COPY KEY</button><p>Expired: ${esc(d.expired_at)}</p></div>`;return}setTimeout(load,4000)}catch(e){document.querySelector("#status").textContent=e.message;setTimeout(load,6000)}}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}load();
</script></body></html>
