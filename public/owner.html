<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner</title><link rel="stylesheet" href="/style.css"></head><body><main><b class="brand">NANG STUDIO OWNER</b><section><h1>Owner Panel</h1><p>Masukkan OWNER_TOKEN yang disimpan di Vercel.</p><input id="t" type="password" placeholder="OWNER_TOKEN"><button onclick="go()">MASUK</button><div id="o"></div></section></main><script>async function go(){const t=document.querySelector("#t").value,r=await fetch("/api/owner-check",{headers:{Authorization:"Bearer "+t}}),d=await r.json();document.querySelector("#o").textContent=d.ok?"OWNER TERDETEKSI ✓":(d.error||"Ditolak")}</script></body></html>
